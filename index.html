<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biblioteca | Training Luis Quirós</title>
<style>
:root{--g:#607A52;--gs:#AFC49F;--t:#C65F3D;--bg:#f5f2ec;--line:#d9d3ca}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#000;font-family:system-ui,-apple-system,sans-serif}button,input,textarea{font:inherit;color:#000}.wrap{max-width:1100px;margin:auto;padding:16px}.hero{background:var(--g);padding:24px;border-radius:24px;color:#fff}.hero *{color:#fff}.hero h1{margin:3px 0}.top{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.search{flex:1;min-width:220px;border:2px solid var(--g);border-radius:14px;padding:12px}.btn{border:1px solid #999;border-radius:12px;padding:10px 13px;background:#fff;font-weight:800;cursor:pointer}.green{background:var(--g);color:#fff;border-color:var(--g)}.terra{background:var(--t);border-color:#a7472c}.soft{background:var(--gs);border-color:var(--g)}.filters{display:flex;gap:7px;overflow:auto;padding-bottom:12px}.chip{white-space:nowrap;border:1px solid var(--g);border-radius:999px;background:#fff;padding:8px 11px}.chip.on{background:var(--g);color:#fff}.bar{display:flex;justify-content:space-between;align-items:center;margin:5px 0 12px}.muted{font-size:13px;color:#444}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}.card h3{margin:5px 0}.star{float:right;border:0;background:none;font-size:22px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.tag{background:#e3ebdf;border-radius:99px;padding:5px 8px;font-size:12px}.tag.t{background:#edb19b}.actions{display:flex;gap:6px;margin-top:12px}.actions>*{flex:1;text-align:center;text-decoration:none}.empty{grid-column:1/-1;background:#fff;border:1px dashed var(--g);border-radius:18px;padding:35px;text-align:center}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:9}.modal.show{display:flex}.sheet{width:min(720px,100%);max-height:92vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:20px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:4px}.full{grid-column:1/-1}.field label{font-weight:800;font-size:13px}.field input,.field textarea{border:1px solid #aaa;border-radius:11px;padding:10px;background:#fff}.field textarea{min-height:90px}.sheetActions{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}.sheetActions>*{flex:1;text-align:center;text-decoration:none}.notes{white-space:pre-wrap}.collection{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0}@media(max-width:600px){.wrap{padding:11px}.form{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><div class="wrap">
<section class="hero"><b>TRAINING LUIS QUIRÓS</b><h1>📚 Biblioteca de ejercicios</h1><div>Tu catálogo personal de ejercicios, videos e indicaciones técnicas.</div></section>
<div class="top"><input id="q" class="search" placeholder="🔎 Buscar ejercicio, músculo, equipo..."><button id="favBtn" class="btn soft" onclick="favFilter()">☆ Favoritos</button><button class="btn terra" onclick="openForm()">＋ Nuevo ejercicio</button></div>
<div id="filters" class="filters"></div>
<div class="top"><select id="equipmentFilter" class="search" onchange="render()"><option value="">Todo el equipo</option></select><select id="collectionFilter" class="search" onchange="render()"><option value="">Todas las colecciones</option></select></div>
<div class="bar"><div><b id="count"></b><div class="muted">Biblioteca maestra · preparada para el programador</div></div><div><button class="btn" onclick="document.getElementById('importFile').click()">↙ Importar</button> <button class="btn" onclick="backup()">↗ Respaldo</button><input id="importFile" type="file" accept=".json,application/json" hidden onchange="restore(this.files[0])"></div></div><main id="grid" class="grid"></main></div>
<div id="formM" class="modal"><div class="sheet"><h2 id="ft">Nuevo ejercicio</h2><div class="form">
<div class="field full"><label>Nombre *</label><input id="name" placeholder="Sentadilla Goblet"></div>
<div class="field"><label>Categoría</label><input id="category" placeholder="Pierna"></div><div class="field"><label>Patrón</label><input id="pattern" placeholder="Sentadilla"></div>
<div class="field"><label>Equipo</label><input id="equipment" placeholder="Kettlebell"></div><div class="field"><label>Músculo / objetivo</label><input id="target" placeholder="Cuádriceps · Glúteos"></div>
<div class="field full"><label>Colecciones</label><input id="collections" placeholder="Rodilla, Principiantes, Casa"><span class="muted">Sepáralas con comas.</span></div>
<div class="field full"><label>Link de YouTube</label><input id="video" placeholder="https://youtu.be/..."></div>
<div class="field full"><label>Indicaciones técnicas</label><textarea id="notes" placeholder="Tus cues, errores frecuentes, ajustes..."></textarea></div></div>
<div class="sheetActions"><button class="btn" onclick="closeM('formM')">Cancelar</button><button class="btn green" onclick="save()">Guardar ejercicio</button></div></div></div>
<div id="detailM" class="modal"><div id="detail" class="sheet"></div></div>
<script>
const KEY='tlq_exercise_library_v2',OLDKEY='tlq_exercise_library_v1';
let items=JSON.parse(localStorage.getItem(KEY)||'null');
if(!Array.isArray(items)){items=JSON.parse(localStorage.getItem(OLDKEY)||'[]');localStorage.setItem(KEY,JSON.stringify(items))}
let edit=null,cat='Todos',fav=false;
const $=x=>document.getElementById(x),E=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){localStorage.setItem(KEY,JSON.stringify(items))}
function cats(){return ['Todos',...new Set(items.map(x=>x.category).filter(Boolean))]}
function unique(field){return [...new Set(items.flatMap(x=>field==='collections'?(x.collections||[]):[x[field]]).filter(Boolean))].sort((a,b)=>a.localeCompare(b))}
function setCat(x){cat=x;render()}
function favFilter(){fav=!fav;render()}
function render(){
 $('filters').innerHTML=cats().map(x=>`<button class="chip ${cat===x?'on':''}" onclick='setCat(${JSON.stringify(x)})'>${E(x)}</button>`).join('');
 $('favBtn').textContent=fav?'⭐ Favoritos':'☆ Favoritos';
 let ef=$('equipmentFilter'),cf=$('collectionFilter'),ev=ef.value,cv=cf.value;
 ef.innerHTML='<option value="">Todo el equipo</option>'+unique('equipment').map(x=>`<option ${x===ev?'selected':''}>${E(x)}</option>`).join('');
 cf.innerHTML='<option value="">Todas las colecciones</option>'+unique('collections').map(x=>`<option ${x===cv?'selected':''}>${E(x)}</option>`).join('');
 let q=$('q').value.toLowerCase(),a=items.filter(x=>
   (cat==='Todos'||x.category===cat)&&(!fav||x.favorite)&&(!ev||x.equipment===ev)&&(!cv||(x.collections||[]).includes(cv))&&
   (!q||[x.name,x.category,x.pattern,x.equipment,x.target,(x.collections||[]).join(' '),x.notes].join(' ').toLowerCase().includes(q))
 );
 $('count').textContent=a.length+' ejercicio'+(a.length===1?'':'s')+(fav?' favoritos':'');
 $('grid').innerHTML=a.length?a.map(x=>`<article class="card"><button class="star" onclick="star('${x.id}')">${x.favorite?'⭐':'☆'}</button><div class="muted">${E(x.category||'Sin categoría')}</div><h3>${E(x.name)}</h3><div class="tags">${x.pattern?`<span class="tag">${E(x.pattern)}</span>`:''}${x.equipment?`<span class="tag">${E(x.equipment)}</span>`:''}${x.target?`<span class="tag t">${E(x.target)}</span>`:''}</div>${(x.collections||[]).length?`<div class="muted">📁 ${E(x.collections.join(' · '))}</div>`:''}<div class="actions"><button class="btn soft" onclick="show('${x.id}')">Ver ficha</button>${x.video?`<a class="btn terra" target="_blank" href="${E(x.video)}">▶ Video</a>`:''}</div></article>`).join(''):`<div class="empty"><b>No hay ejercicios aquí.</b><br><span class="muted">Agrega uno nuevo o cambia los filtros.</span></div>`
}
function openForm(id=null){edit=id;let x=items.find(i=>i.id===id)||{};$('ft').textContent=id?'Editar ejercicio':'Nuevo ejercicio';['name','category','pattern','equipment','target','video','notes'].forEach(k=>$(k).value=x[k]||'');$('collections').value=(x.collections||[]).join(', ');$('formM').classList.add('show')}
function save(){if(!$('name').value.trim())return alert('Escribe el nombre del ejercicio.');let old=items.find(x=>x.id===edit),x={id:edit||'ex_'+Date.now(),name:$('name').value.trim(),category:$('category').value.trim(),pattern:$('pattern').value.trim(),equipment:$('equipment').value.trim(),target:$('target').value.trim(),collections:$('collections').value.split(',').map(v=>v.trim()).filter(Boolean),video:$('video').value.trim(),notes:$('notes').value.trim(),favorite:old?.favorite||false};items=edit?items.map(i=>i.id===edit?x:i):[x,...items];persist();closeM('formM');render()}
function star(id){let x=items.find(i=>i.id===id);if(!x)return;x.favorite=!x.favorite;persist();render()}
function show(id){let x=items.find(i=>i.id===id);if(!x)return;$('detail').innerHTML=`<div class="muted">${E(x.category)}</div><h2>${E(x.name)}</h2><div class="tags">${x.pattern?`<span class="tag">${E(x.pattern)}</span>`:''}${x.equipment?`<span class="tag">${E(x.equipment)}</span>`:''}${x.target?`<span class="tag t">${E(x.target)}</span>`:''}</div>${(x.collections||[]).length?`<div class="collection"><b>📁 Colecciones</b><br>${E(x.collections.join(' · '))}</div>`:''}<h3>Indicaciones técnicas</h3><div class="notes">${E(x.notes||'Sin indicaciones todavía.')}</div><div class="sheetActions"><button class="btn" onclick="closeM('detailM')">Cerrar</button><button class="btn soft" onclick="closeM('detailM');openForm('${x.id}')">✏️ Editar</button>${x.video?`<a class="btn terra" target="_blank" href="${E(x.video)}">▶ Video</a>`:''}<button class="btn" onclick="copyEx('${x.id}')">📋 Copiar</button><button class="btn" onclick="del('${x.id}')">Eliminar</button></div>`;$('detailM').classList.add('show')}
function copyEx(id){let x=items.find(i=>i.id===id);navigator.clipboard.writeText([x.name,x.notes,x.video].filter(Boolean).join('\n')).then(()=>alert('Ejercicio copiado.'))}
function del(id){if(confirm('¿Eliminar este ejercicio?')){items=items.filter(x=>x.id!==id);persist();closeM('detailM');render()}}
function closeM(id){$(id).classList.remove('show')}
function backup(){let b=new Blob([JSON.stringify({version:2,exported:new Date().toISOString(),items},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Biblioteca_Training_Luis_Quiros_respaldo.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let j=JSON.parse(r.result),arr=Array.isArray(j)?j:j.items;if(!Array.isArray(arr))throw 0;if(confirm(`Importar ${arr.length} ejercicios? Esto reemplazará la biblioteca actual.`)){items=arr;persist();render();alert('Biblioteca importada.')}}catch(e){alert('Ese archivo no parece ser un respaldo válido.')}};r.readAsText(file);$('importFile').value=''}

$('q').addEventListener('input',render);render();
</script></body></html>
